version: '3'
services:
  app:
    # CI pushes this image; on EC2 `docker-compose pull` fetches the latest build.
    # Locally, `docker-compose up --build` builds it from the Dockerfile instead.
    image: ${DOCKERHUB_USERNAME:-local}/lab6-app:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
    depends_on:
      - db

  db:
    image: mongo:latest
    volumes:
      - db-data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js

volumes:
  db-data: